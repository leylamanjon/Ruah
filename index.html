<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Propuesta RUAH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Propuesta KOINOR × RUAH — una sola página con menú lateral.
   Crema cálido, tarjetas blancas, naranja y ámbar de la llama como acento. */
:root{
  --bg:#FAF7F2; --fg:#2B2118; --mu:#7A6D62; --ln:#E9E0D3; --cd:#fff;
  --ac:#A85A24; --as:#F6EAD6; --sun:#E4B672; 
  --sw:284px; --r:16px;
  --sh1:none;
  --sh2:none;
  --font:Inter,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{overflow-x:clip;margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.65 var(--font);-webkit-font-smoothing:antialiased;font-style:normal}
em,i,cite{font-style:normal}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
img{display:block;max-width:100%}
.ic{display:block;flex:none}

/* ---------- barra de avance ---------- */
#prog{position:fixed;top:60px;left:0;right:0;height:3px;z-index:40;background:transparent;pointer-events:none}
#prog i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--sun),var(--ac))}

/* ---------- encabezado y pager ---------- */
.logo-wrap{display:flex;align-items:center;gap:14px}
.logo-wrap .rk{height:64px;width:auto}
.logo-wrap .div{width:1px;height:34px;background:var(--ln)}
.klogo{height:17px;width:auto;aspect-ratio:59/20;color:#6B4D35;display:block;flex:none}
#hd{position:fixed;top:0;left:0;right:0;height:60px;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:0 clamp(16px,4vw,40px);
  background:rgba(250,246,239,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
#hd .home{grid-column:2;display:flex;align-items:center;gap:16px;border-radius:8px}
#hd .rk{height:42px;width:auto}
#hd .div{width:1px;height:24px;background:var(--ln)}
#hd .where{grid-column:3;justify-self:end;max-width:100%;font-size:14px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd .where b{color:var(--fg);font-weight:700}

#pager{position:fixed;right:20px;bottom:20px;z-index:30;display:flex;align-items:center;gap:2px;padding:5px;
  background:var(--cd);border:1px solid var(--ln);border-radius:999px;box-shadow:0 2px 10px rgba(43,33,24,.10)}
#pager button{display:flex;align-items:center;gap:6px;height:40px;min-width:40px;justify-content:center;padding:0 12px;border-radius:999px;
  font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mu);transition:background .15s,color .15s}
#pager button:hover:not(:disabled){background:var(--as);color:var(--ac)}
#pager button:disabled{opacity:.35;cursor:default}
#pager .cur{display:flex;align-items:baseline;gap:4px;padding:0 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
#pager .cur b{font-size:14px;font-weight:700;color:var(--fg);letter-spacing:-.02em}
#pager .cur small{font-size:14px;color:var(--mu);font-weight:400}

/* ---------- contenido ---------- */
main{padding:84px clamp(20px,4vw,56px) 0}
.wrap{max-width:960px;margin:0 auto}

h1{font-weight:700;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
h2{font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.2;text-wrap:balance}
h3{font-size:14px;font-weight:700;line-height:1.35;letter-spacing:-.005em}
.muted{color:var(--mu)}
.lead{color:var(--fg);font-size:14px;max-width:64ch;margin:0 0 24px;text-wrap:pretty}

.hero{position:relative;min-height:440px;border-radius:24px;overflow:hidden;background:#2a2a1c var(--img) center 40%/cover;margin:0 0 24px;box-shadow:var(--sh2)}
.hero-ov{position:absolute;inset:0;display:flex;align-items:flex-end;padding:clamp(24px,5vw,56px);
  background:linear-gradient(rgba(20,10,5,.12) 0%,rgba(20,10,5,.52) 55%,rgba(16,8,3,.86) 100%)}
.hero-in{max-width:700px;color:#fff}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:6px 14px 6px 8px;margin-bottom:18px;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.95)}
.hero-badge .gi{width:22px;height:22px;border-radius:50%;background:var(--sun);border:0;color:#2B2118}
.hero h1{color:#fff;font-size:clamp(32px,4.8vw,44px);margin:0 0 14px}
.hero p{color:rgba(255,255,255,.88);font-size:14px;max-width:560px}
.hero-cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;background:#fff;color:var(--fg);font-size:14px;font-weight:700;border:1px solid #fff;transition:.2s}
.btn:hover{background:var(--sun);border-color:var(--sun)}

.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin:0 0 12px}
.toc a{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--cd);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh1);transition:.2s}
.toc a:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:var(--sh2)}
.toc small{display:block;font-size:14px;color:var(--mu);font-weight:700;letter-spacing:.08em}
.toc .tt{display:block;font-size:14px;font-weight:700;line-height:1.3}
.toc .go{margin-left:auto;color:var(--mu);opacity:0;transform:translateX(-4px);transition:.2s}
.toc a:hover .go{opacity:1;transform:none;color:var(--ac)}

.ic-tile{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--as);color:var(--ac);flex:none}
.ic-tile.w{background:var(--cd);border:1px solid var(--ln);box-shadow:var(--sh1)}

/* secciones: cada una es una franja de color propia, de borde a borde */
.rsec{position:relative;isolation:isolate;padding:84px 0 88px;--band:#FAF7F2}
.rsec::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:50%;width:100vw;margin-left:-50vw;background:var(--band)}
.rsec.alt{--band:var(--as)}
.rsec.alt .chip.line{background:#fff}
.toc{margin-bottom:56px}
.sh{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.sh-ic{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;flex:none;background:var(--cd);color:var(--ac);border:1px solid var(--ln);box-shadow:var(--sh1)}
.sh .bc{font-size:14px;font-weight:700;color:var(--mu);margin-bottom:2px}
.sh h2 .n{color:var(--ac)}

.card{position:relative;overflow:hidden;background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);padding:22px;box-shadow:var(--sh1);transition:box-shadow .25s,transform .25s,border-color .25s}
.card p{color:var(--fg);font-size:14px;margin-top:6px}
.card .ct{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.card.bar::after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:3px;border-radius:3px 3px 0 0;
  background:linear-gradient(90deg,var(--sun),var(--ac));transform-origin:left;transform:scaleX(var(--p,1));width:calc(100% - 44px)}
.card.dark{background:var(--fg);border-color:var(--fg);color:#fff}
.card.dark p,.card.dark .muted{color:rgba(255,255,255,.78)}
.card.dark .ic-tile{background:rgba(255,255,255,.14);color:var(--sun)}
.card.soft{background:var(--cd);border-left:4px solid var(--ac)}
.statement{font-size:14px;line-height:1.6;font-weight:400;color:var(--fg);max-width:68ch;text-wrap:pretty}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:var(--as);color:var(--ac);font-size:14px;font-weight:700;letter-spacing:.01em;line-height:1.4}
.chip.dark{background:var(--fg);color:#fff}
.chip.line{background:var(--cd);border:1px solid var(--ln);color:var(--fg);font-weight:400}
.sep{align-self:center;font-size:14px;color:var(--mu)}
.lbl{font-size:14px;color:var(--mu);margin-top:14px}

/* antecedentes */
.ant{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:stretch}
.photo{position:relative;border-radius:20px;overflow:hidden;min-height:340px;box-shadow:var(--sh2);background:#3f5a2a}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner{position:relative;border-radius:24px;overflow:hidden;height:300px;box-shadow:var(--sh2);margin-bottom:16px;background:#6b5a2a}
.banner img{width:100%;height:100%;object-fit:cover;object-position:center 45%}


/* concepto: línea de tiempo */
.tlh{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:10px}
.tlh::before{content:"";position:absolute;top:17px;left:17px;right:17px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--sun),var(--ac))}
.tlh>li{position:relative;padding-top:50px}
.tlh .dot{position:absolute;top:0;left:0;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;font-size:14px;font-weight:700;color:#2B2118;border:3px solid var(--band);
  background:color-mix(in srgb,var(--sun) calc(100% - var(--k)*33%),var(--ac))}
.tlh>li:last-child .dot{background:var(--fg);color:#fff}
.tlh .chip{margin-bottom:10px}
.tlh h3{font-size:14px;margin-bottom:8px}
.tlh ul{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--fg)}
.tlh ul li{position:relative;padding-left:14px}
.tlh ul li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:2px;background:var(--ac)}
.tlh p{font-size:14px;color:var(--fg)}

/* preguntas */
.q{display:flex;gap:12px;align-items:center;padding:16px 18px}
.q span.t{font-size:14px;font-weight:700;line-height:1.4}

/* modelo: tira de pasos */
.mlist{border-top:2px solid var(--fg)}
.mlist li{display:grid;grid-template-columns:72px 200px minmax(0,1fr);gap:20px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--ln)}
.mlist .mn{font-size:28px;font-weight:700;letter-spacing:-.025em;color:var(--ac);line-height:1}
.mlist h3{font-size:14px}
.mlist p{color:var(--fg);max-width:60ch}

/* frentes */
.seg{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.seg button{padding:11px 20px;border-radius:999px;border:1.5px solid rgba(43,33,24,.28);background:transparent;font-size:14px;font-weight:700;color:var(--fg);transition:.15s}
.seg button:hover{border-color:var(--ac);color:var(--ac);background:rgba(255,255,255,.6)}
.seg button.on{border-color:var(--ac);background:var(--ac);color:#fff}
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 0}
.area{padding:20px}
.area .ct{margin-bottom:6px}
.area h3{font-size:14px}
.area p{margin:0 0 4px}
.area .chips{margin-top:10px}

/* conexión */
.flow .card{padding:18px}
.flow .num{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--mu)}
.flow .card.dark .num{color:rgba(255,255,255,.6)}

.grow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end}
.gr{display:flex;flex-direction:column;justify-content:flex-end;padding:24px;border-radius:var(--r) var(--r) 0 0;border-bottom:4px solid var(--ac)}
.gr h3{font-size:14px;line-height:1.3;margin-bottom:2px}
.gr .chip{align-self:flex-start;margin-bottom:12px}
.gr.g1{min-height:190px;background:var(--as)}
.gr.g2{min-height:280px;background:var(--sun)}
.gr.g3{min-height:370px;background:var(--ac);color:#fff}
.gr.g3 .chip.dark{background:#fff;color:var(--ac)}
.gr .chip.line{border-color:var(--ln)}
.gr.g3 .chip.line{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff}
/* equipo */
.person{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px}
.person .ini{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--as);color:var(--ac);font-size:14px;font-weight:700;flex:none}
.person b{font-size:14px;font-weight:700;line-height:1.3}
.person small{color:var(--mu);font-size:14px}

/* inversión */
.inv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:12px}
.mode{display:flex;gap:14px;align-items:center;padding:16px 18px;font-size:14px;font-weight:700}
.price .k{font-size:14px}
.price .v{font-size:44px;font-weight:700;letter-spacing:-.035em;line-height:1;margin-top:10px}
.price .v span{font-size:14px;font-weight:400;letter-spacing:0;margin-left:8px;opacity:.75}

/* comercial */
.terms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.terms>div{padding:16px 18px;border-right:1px solid var(--ln)}
.terms>div:last-child{border-right:0}
.terms small{display:block;font-size:14px;color:var(--mu);font-weight:400}
.terms b{display:block;margin-top:4px;font-size:14px;font-weight:700;letter-spacing:-.01em}
/* próximos pasos */
.tl{background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh1);padding:8px 22px}
.tl li{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--ln);align-items:center}
.tl li:last-child{border-bottom:0}
.tl .n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--ln);font-size:14px;font-weight:700;color:var(--mu)}
.tl li.here .n{background:var(--sun);border-color:var(--sun);color:#2B2118}
.tl li.fin .n{background:var(--fg);border-color:var(--fg);color:#fff}
.tl b{font-size:14px;font-weight:700}
.tl .chip{margin-left:10px;vertical-align:1px}

.foot{margin-top:64px;padding-top:24px;border-top:1px solid var(--ln);display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--mu);font-size:14px}
.foot .rk{height:44px;width:auto}
.foot .div{width:1px;height:26px;background:var(--ln)}

/* aparición */
.rv{opacity:0;transform:translateY(8px)}
.rv.in{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease}

/* acceso (apagado por ahora) */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-in{width:100%;max-width:400px;display:flex;flex-direction:column;gap:20px}
.gate-in .logo-wrap{padding:0}
.gate-in label{font-size:14px;font-weight:700}
.gate-in input{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--ln);background:var(--cd);font:inherit;margin-top:6px}
.pwf{position:relative}
.pwf input{padding-right:48px}
.pwf button{position:absolute;right:4px;top:10px;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;color:var(--mu)}
.pwf button:hover{color:var(--ac)}
.gate-in{align-items:stretch}
.gate-in .logo-wrap{justify-content:center;margin-bottom:8px}
.gate-in .btn{align-self:stretch;justify-content:center}
.gate-in input:focus{outline:2px solid var(--ac);outline-offset:1px}
.err{color:#B3261E;font-size:14px;margin-top:6px}
.gate-in .btn{background:var(--fg);color:#fff;border-color:var(--fg);align-self:stretch;justify-content:center}

/* adaptación */
@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .areas{grid-template-columns:minmax(0,1fr)}
  #hd .where{display:none}
  .hero{min-height:420px;border-radius:18px}
  .banner{height:200px;border-radius:18px}
  .ant,.inv{grid-template-columns:minmax(0,1fr)}
  .grow{grid-template-columns:minmax(0,1fr);gap:0;align-items:stretch}
  .gr{min-height:0!important;border-radius:0}
  .gr.g1{width:70%}.gr.g2{width:85%}
  .photo{min-height:260px}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .terms{grid-template-columns:repeat(2,minmax(0,1fr))}
  .terms>div:nth-child(2){border-right:0}
  .terms>div:nth-child(-n+2){border-bottom:1px solid var(--ln)}
  .sh-ic{width:44px;height:44px;border-radius:13px}
  h2{font-size:28px}
  .rsec{padding:60px 0 64px}
}
@media (max-width:860px){
  .tlh{grid-template-columns:minmax(0,1fr);gap:0}
  .tlh::before{top:18px;bottom:18px;left:16px;right:auto;width:3px;height:auto;background:linear-gradient(var(--sun),var(--ac))}
  .tlh>li{padding:0 0 30px 56px}
  .tlh>li:last-child{padding-bottom:0}
}
@media (max-width:620px){
  .mlist li{grid-template-columns:44px minmax(0,1fr);gap:4px 14px}
  .mlist p{grid-column:2}
  .g4{grid-template-columns:minmax(0,1fr)}
  .seg button{flex:1 1 calc(50% - 10px);text-align:center;padding:10px 12px;font-size:14px}
  main{padding-inline:16px}
  #pager{right:12px;bottom:12px}
  #pager button{padding:0 9px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>

function build(){
  const hero=`
   <section id="inicio">
    <div class="hero rv" style="--img:url(img/hero.jpg)" role="img" aria-label="Mazorcas de cacao rojas en el tronco y un productor al fondo">
      <div class="hero-ov"><div class="hero-in">
                <h1>Estructurar para crecer sin perder la esencia</h1>
        <p>Un acompañamiento para la siguiente etapa de RUAH: empresa, producto, marca, experiencia y mercado.</p>
      </div></div>
    </div>
    <nav class="toc rv" aria-label="Contenido">${ORDER.map(id=>`<a href="#${id}"><span><small>${pad(num(id))}</small><span class="tt">${SECS[id].nav}</span></span><span class="go">${I('arrow',16)}</span></a>`).join('')}</nav>
   </section>`;
  const secs=ORDER.map(id=>{const s=SECS[id],g=groupOf(id);return `
   <section class="rsec${num(id)%2===0?' alt':''}" id="${id}" data-id="${id}">
     <header class="sh rv"><div><h2><span class="n">${num(id)}.</span> ${s.title}</h2></div></header>
     <p class="lead rv">${s.lead}</p>
     <div class="rv">${B[id]()}</div>
   </section>`}).join('');
  $('#wrap').innerHTML=hero+secs;

  /* frentes */
  const seg=$$('#seg button'),pnl=$('#fpnl');
  const showF=n=>{const f=F[n];
    seg.forEach((b,j)=>{b.classList.toggle('on',n===j);b.setAttribute('aria-pressed',n===j)});
    pnl.innerHTML=`<div class="card"><h3 style="font-size:14px">${f.intro}</h3>${f.attrs?chips(f.attrs,'dark'):''}<p style="font-size:14px">${f.note}</p></div>
      <p class="muted" style="margin:20px 0 0;font-size:14px">Áreas que podrían intervenirse</p>
      <div class="areas">${f.areas.map(a=>`<div class="card area"><div class="ct">${tile(a.i)}<h3>${a.t}</h3></div>${a.p?`<p>${a.p}</p>`:''}${a.chips?chips(a.chips,'line',a.sep):''}</div>`).join('')}</div>`;
  };
  seg.forEach((b,i)=>b.addEventListener('click',()=>showF(i)));showF(0);

  $$('[data-i]').forEach(n=>n.innerHTML=I(n.dataset.i,20));
}

/* ---------- navegación, avance y aparición ---------- */
function setup(){
  const IDS=['inicio',...ORDER];
  const pad2=n=>String(n).padStart(2,'0');
  let cur=0;
  const mark=i=>{
    cur=i;
    const prev=i>0?i-1:null,next=i<ORDER.length?i+1:null;
    $('#pcn').textContent=pad2(i);
    $('#pvn').textContent=prev===null?'':pad2(prev);
    $('#nxn').textContent=next===null?'':pad2(next);
    $('#pv').disabled=prev===null;
    $('#nx').disabled=next===null;
    const nm=j=>j===0?'la portada':SECS[ORDER[j-1]].nav;
    $('#pv').setAttribute('aria-label',prev===null?'Sin sección anterior':'Ir a '+nm(prev));
    $('#pv').title=prev===null?'':nm(prev);
    $('#nx').setAttribute('aria-label',next===null?'Última sección':'Ir a '+nm(next));
    $('#nx').title=next===null?'':nm(next);
    $('#where').innerHTML=i===0?'':`${groupOf(ORDER[i-1]).name} · <b>${SECS[ORDER[i-1]].nav}</b>`;
    try{history.replaceState(null,'',i?'#'+ORDER[i-1]:location.pathname+location.search)}catch(e){}
  };
  const goTo=i=>{const el=document.getElementById(IDS[i]);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};
  $('#pv').addEventListener('click',()=>cur>0&&goTo(cur-1));
  $('#nx').addEventListener('click',()=>cur<ORDER.length&&goTo(cur+1));
  addEventListener('keydown',e=>{
    if(e.target.closest&&e.target.closest('input,textarea,select'))return;
    if(e.altKey||e.ctrlKey||e.metaKey)return;
    if(e.key==='ArrowRight'&&cur<ORDER.length){e.preventDefault();goTo(cur+1)}
    else if(e.key==='ArrowLeft'&&cur>0){e.preventDefault();goTo(cur-1)}
  });

  /* sección activa: la que cruza el tercio superior de la pantalla */
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)mark(ORDER.indexOf(e.target.dataset.id)+1)}),{rootMargin:'-30% 0px -65% 0px'});
  $$('.rsec').forEach(s=>io.observe(s));
  const top=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)mark(0)}),{rootMargin:'0px 0px -75% 0px'});
  top.observe($('#inicio'));

  const rv=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rv.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px',threshold:.04});
  $$('.rv').forEach(el=>rv.observe(el));

  const bar=$('#progBar');
  const onScroll=()=>{const h=document.documentElement,m=h.scrollHeight-h.clientHeight;
    bar.style.transform=`scaleX(${m>0?Math.min(1,h.scrollTop/m):0})`;
    if(m>0&&h.scrollTop>=m-4)mark(ORDER.length)};
  addEventListener('scroll',onScroll,{passive:true});onScroll();
  mark(0);
}
